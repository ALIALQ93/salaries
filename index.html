    async function loadWageManagementData() {
        const month = parseInt(document.getElementById('wage-month').value);
        const year = parseInt(document.getElementById('wage-year').value);
        const projectFilter = document.getElementById('wage-project-filter').value;
        
        try {
            let employeesSnap;
            
            // تحديد المشاريع المتاحة حسب الدور
            let availableProjectIds = [];
            if (currentUserData.role === 'supervisor' && currentUserData.assignedProjects && currentUserData.assignedProjects.length > 0) {
                availableProjectIds = currentUserData.assignedProjects;
            } else {
                const projectsSnap = await db.collection('projects').where('status', '!=', 'hidden').get();
                projectsSnap.forEach(doc => {
                    availableProjectIds.push(doc.id);
                });
            }
            
            // تطبيق فلتر المشروع
            let projectIdsToQuery = availableProjectIds;
            if (projectFilter !== 'all') {
                if (availableProjectIds.includes(projectFilter)) {
                    projectIdsToQuery = [projectFilter];
                } else {
                    projectIdsToQuery = [];
                }
            }
            
            if (projectIdsToQuery.length === 0) {
                document.getElementById('employee-wage-management-table').innerHTML = `<p class="text-gray-500 text-center py-8">${currentLanguage === 'ar' ? 'لا توجد موظفين يوميين' : 'No daily employees'}</p>`;
                return;
            }
            
            // جلب الموظفين مع فلترة حسب المشاريع المتاحة
            // معالجة حد Firestore (10 قيم كحد أقصى في 'in')
            if (currentUserData.role === 'supervisor' && currentUserData.assignedProjects && currentUserData.assignedProjects.length > 0) {
                // إذا كان عدد المشاريع > 10، جلب كل الموظفين ثم فلترة في الذاكرة
                if (projectIdsToQuery.length > 10) {
                    employeesSnap = await db.collection('employees')
                        .where('type', '==', 'daily')
                        .where('status', '==', 'active')
                        .get();
                } else {
                    // استخدام الاستعلام المباشر إذا كان <= 10
                    employeesSnap = await db.collection('employees')
                        .where('type', '==', 'daily')
                        .where('status', '==', 'active')
                        .where('projectId', 'in', projectIdsToQuery)
                        .get();
                }
            } else {
                employeesSnap = await db.collection('employees')
                    .where('type', '==', 'daily')
                    .where('status', '==', 'active')
                    .get();
            }
            
            const employees = [];
            employeesSnap.forEach(doc => {
                const data = doc.data();
                // تطبيق فلتر المشروع على البيانات المحملة
                if (projectFilter === 'all' || data.projectId === projectFilter) {
                    if (availableProjectIds.includes(data.projectId)) {
                        employees.push({ id: doc.id, ...data });
                    }
                }
            });
            
            employees.sort((a, b) => {
                const projectA = window.projectsListData?.find(p => p.id === a.projectId)?.name || '';
                const projectB = window.projectsListData?.find(p => p.id === b.projectId)?.name || '';
                if (projectA !== projectB) return projectA.localeCompare(projectB);
                return a.name.localeCompare(b.name);
            });
            
            document.getElementById('employee-wage-management-table').innerHTML = generateWageManagementTable(employees, month, year);
        } catch (error) {
            console.error('Error loading wage management data:', error);
            showToast(t('error'), 'error');
        }
    }
    
    async function saveMonthlyWage(employeeId, month, year) {
        const wageInput = document.getElementById(`wage-input-${employeeId}`);
        if (!wageInput) return;
        
        const wage = parseFloat(wageInput.value);
        if (isNaN(wage) || wage < 0) {
            showToast(currentLanguage === 'ar' ? 'يرجى إدخال قيمة صحيحة' : 'Please enter a valid value', 'error');
            return;
        }
        
        try {
            const empDoc = await db.collection('employees').doc(employeeId).get();
            if (!empDoc.exists) {
                showToast(t('error'), 'error');
                return;
            }
            
            const empData = empDoc.data();
            const wageHistory = empData.wageHistory || [];
            
            // البحث عن سجل موجود لهذا الشهر
            const existingIndex = wageHistory.findIndex(w => w.month === month && w.year === year);
            
            if (existingIndex >= 0) {
                // تحديث السجل الموجود
                wageHistory[existingIndex].wage = wage;
                wageHistory[existingIndex].updatedAt = new Date();
            } else {
                // إضافة سجل جديد
                wageHistory.push({
                    month,
                    year,
                    wage,
                    createdAt: new Date(),
                    updatedAt: new Date()
                });
            }
            
            // تحديث الأجر اليومي الحالي إذا كان الشهر الحالي
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentYear = now.getFullYear();
            
            const updateData = {
                wageHistory,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            if (month === currentMonth && year === currentYear) {
                updateData.dailyWage = wage;
            }
            
            await db.collection('employees').doc(employeeId).update(updateData);
            
            showToast(t('saved'), 'success');
            
            // تحديث الجدول
            loadWageManagementData();
        } catch (error) {
            console.error('Error saving monthly wage:', error);
            showToast(t('error'), 'error');
        }
    }

    function generateVehicleWageManagementTable(vehicles, month, year) {
        if (vehicles.length === 0) {
            return `<p class="text-gray-500 text-center py-8">${currentLanguage === 'ar' ? 'لا توجد آليات' : 'No vehicles'}</p>`;
        }
        
        return `
            <table class="w-full text-sm border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b">
                        <th class="px-4 py-3 text-right font-medium">${t('vehicleName')}</th>
                        <th class="px-4 py-3 text-right font-medium">${t('projects')}</th>
                        <th class="px-4 py-3 text-center font-medium">${t('vehicleCalculationType')}</th>
                        <th class="px-4 py-3 text-center font-medium">${t('currentDailyWage')}</th>
                        <th class="px-4 py-3 text-center font-medium">${t('wageAmount')} (${currentLanguage === 'ar' ? 'IQD' : 'IQD'})</th>
                        <th class="px-4 py-3 text-center font-medium">${t('actions')}</th>
                    </tr>
                </thead>
                <tbody>
                    ${vehicles.map(veh => {
                        const project = window.projectsListData?.find(p => p.id === veh.projectId);
                        const calcType = veh.calculationType || 'daily';
                        const baseDaily = veh.dailyWage || 0;
                        const baseMonthly = veh.monthlyWage || 0;
                        const wageHistory = veh.wageHistory || [];
                        const monthWage = wageHistory.find(w => w.month === month && w.year === year);
                        let displayWage = monthWage ? monthWage.wage : (calcType === 'daily' ? baseDaily : baseMonthly);
                        const currentLabel = calcType === 'daily' ? t('vehicleDailyWage') : t('vehicleMonthlyWage');
                        
                        return `
                            <tr class="border-b hover:bg-gray-50" data-vehicle-id="${veh.id}">
                                <td class="px-4 py-3 font-medium">${veh.name || ''}</td>
                                <td class="px-4 py-3">${project?.name || '-'}</td>
                                <td class="px-4 py-3 text-center">${t(calcType)}</td>
                                <td class="px-4 py-3 text-center">${currentLabel}: ${displayWage.toFixed(2)} ${currentLanguage === 'ar' ? 'IQD' : 'IQD'}</td>
                                <td class="px-4 py-3 text-center">
                                    <input type="number" 
                                           id="vehicle-wage-input-${veh.id}" 
                                           step="0.01" 
                                           min="0" 
                                           value="${displayWage.toFixed(2)}"
                                           class="w-32 px-3 py-1 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none text-center">
                                </td>
                                <td class="px-4 py-3 text-center">
                                    <button onclick="saveVehicleWage('${veh.id}', ${month}, ${year})" 
                                            class="px-3 py-1 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition text-sm">
                                        ${t('save')}
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
    }
    
    async function loadVehicleWageManagementData() {
        const month = parseInt(document.getElementById('wage-month').value);
        const year = parseInt(document.getElementById('wage-year').value);
        const projectFilter = document.getElementById('wage-project-filter').value;
        
        try {
            let availableProjectIds = [];
            if (currentUserData.role === 'supervisor' && currentUserData.assignedProjects && currentUserData.assignedProjects.length > 0) {
                availableProjectIds = currentUserData.assignedProjects;
            } else {
                const projectsSnap = await db.collection('projects').where('status', '!=', 'hidden').get();
                projectsSnap.forEach(doc => {
                    availableProjectIds.push(doc.id);
                });
            }
            
            let projectIdsToQuery = availableProjectIds;
            if (projectFilter !== 'all') {
                if (availableProjectIds.includes(projectFilter)) {
                    projectIdsToQuery = [projectFilter];
                } else {
                    projectIdsToQuery = [];
                }
            }
            
            if (projectIdsToQuery.length === 0) {
                document.getElementById('vehicle-wage-management-table').innerHTML = `<p class="text-gray-500 text-center py-8">${currentLanguage === 'ar' ? 'لا توجد آليات' : 'No vehicles'}</p>`;
                return;
            }
            
            let vehiclesSnap;
            if (currentUserData.role === 'supervisor' && currentUserData.assignedProjects && currentUserData.assignedProjects.length > 0) {
                if (projectIdsToQuery.length > 10) {
                    vehiclesSnap = await db.collection('vehicles')
                        .where('status', '==', 'active')
                        .get();
                } else {
                    vehiclesSnap = await db.collection('vehicles')
                        .where('status', '==', 'active')
                        .where('projectId', 'in', projectIdsToQuery)
                        .get();
                }
            } else {
                vehiclesSnap = await db.collection('vehicles')
                    .where('status', '==', 'active')
                    .get();
            }
            
            const vehicles = [];
            vehiclesSnap.forEach(doc => {
                const data = doc.data();
                if (projectFilter === 'all' || data.projectId === projectFilter) {
                    if (availableProjectIds.includes(data.projectId)) {
                        vehicles.push({ id: doc.id, ...data });
                    }
                }
            });
            
            vehicles.sort((a, b) => {
                const projectA = window.projectsListData?.find(p => p.id === a.projectId)?.name || '';
                const projectB = window.projectsListData?.find(p => p.id === b.projectId)?.name || '';
                if (projectA !== projectB) return projectA.localeCompare(projectB);
                return (a.name || '').localeCompare(b.name || '');
            });
            
            document.getElementById('vehicle-wage-management-table').innerHTML = generateVehicleWageManagementTable(vehicles, month, year);
        } catch (error) {
            console.error('Error loading vehicle wage management data:', error);
            showToast(t('error'), 'error');
        }
    }

    async function saveUser() {
        // الحصول على النموذج أولاً
        const form = document.getElementById('user-form');
        if (!form) {
            console.error('User form not found - modal may not be open');
            showToast(t('error'), 'error');
            return;
        }
        
        // الحصول على العناصر من داخل النموذج
        const idEl = form.querySelector('#user-id');
        const nameEl = form.querySelector('#user-name');
        const emailEl = form.querySelector('#user-email');
        const roleEl = form.querySelector('#user-role');
        
        // تحقق من وجود العناصر
        if (!nameEl || !emailEl || !roleEl) {
            console.error('User form elements not found:', { nameEl, emailEl, roleEl });
            showToast(t('error'), 'error');
            return;
        }
        
        const id = idEl?.value || '';
        const name = (nameEl.value || '').trim();
        const email = (emailEl.value || '').trim();
        const role = roleEl.value || 'supervisor';
        const assignedProjects = role === 'supervisor' ? 
            Array.from(document.querySelectorAll('input[name="user-projects"]:checked')).map(cb => cb.value) : null;
        
        if (!name || !email) {
            showToast(t('required'), 'error');
            return;
        }
        
        try {
            if (id) {
                // تعديل
                await db.collection('users').doc(id).update({
                    name,
                    role,
                    assignedProjects,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                logActivity('update', 'user', id, name, currentLanguage === 'ar' ? 'تعديل مستخدم' : 'User updated');
            } else {
                // إضافة - إنشاء حساب في Auth أولاً
                const passwordEl = document.getElementById('user-password');
                const password = passwordEl?.value || '';
                if (!password || password.length < 6) {
                    showToast(currentLanguage === 'ar' ? 'كلمة المرور يجب أن تكون 6 أحرف على الأقل' : 'Password must be at least 6 characters', 'error');
                    return;
                }
                
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                
                await db.collection('users').doc(userCredential.user.uid).set({
                    email,
                    name,
                    role,
                    assignedProjects,
                    status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: currentUser.uid
                });
                logActivity('create', 'user', userCredential.user.uid, name, currentLanguage === 'ar' ? 'إضافة مستخدم' : 'User created');
                
                // إعادة تسجيل دخول المدير الحالي
                await auth.signInWithEmailAndPassword(currentUser.email, prompt(currentLanguage === 'ar' ? 'أدخل كلمة مرورك لإعادة تسجيل الدخول:' : 'Enter your password to re-login:'));
            }
            
            closeModal();
            showToast(t('saved'), 'success');
            loadUsers();
            
        } catch (error) {
            console.error('Error saving user:', error);
            if (error.code === 'auth/email-already-in-use') {
                showToast(currentLanguage === 'ar' ? 'البريد الإلكتروني مستخدم بالفعل' : 'Email already in use', 'error');
            } else {
                showToast(t('error'), 'error');
            }
        }
    }
    
    async function deleteUser(userId) {
        if (!confirm(t('confirmDelete'))) return;
        
        try {
            const userDoc = await db.collection('users').doc(userId).get();
            const userName = userDoc.exists ? userDoc.data().name : userId;
            await db.collection('users').doc(userId).delete();
            logActivity('delete', 'user', userId, userName, currentLanguage === 'ar' ? 'حذف مستخدم' : 'User deleted');
            showToast(t('deleted'), 'success');
            loadUsers();
        } catch (error) {
            console.error('Error deleting user:', error);
            showToast(t('error'), 'error');
        }
    }

                    <h3 class="font-bold text-lg mb-4">🔐 ${currentLanguage === 'ar' ? 'تغيير كلمة المرور' : 'Change Password'}</h3>
                    <form onsubmit="changePassword(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">${currentLanguage === 'ar' ? 'كلمة المرور الحالية' : 'Current Password'}</label>

                        </div>

                            <input type="password" id="new-password" required minlength="6"
                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">${currentLanguage === 'ar' ? 'تأكيد كلمة المرور' : 'Confirm Password'}</label>

                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                        </div>

                    </form>

        `;
    }
    
    function setLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        updateTranslations();
        loadSettings();
    }
    
    async function changePassword(e) {
        e.preventDefault();
        
        const currentPasswordEl = document.getElementById('current-password');
        const newPasswordEl = document.getElementById('new-password');
        const confirmPasswordEl = document.getElementById('confirm-password');
        
        if (!currentPasswordEl || !newPasswordEl || !confirmPasswordEl) {
            showToast(t('error'), 'error');
            return;
        }
        
        const currentPassword = currentPasswordEl.value || '';
        const newPassword = newPasswordEl.value || '';
        const confirmPassword = confirmPasswordEl.value || '';
        
        if (newPassword !== confirmPassword) {
            showToast(currentLanguage === 'ar' ? 'كلمة المرور غير متطابقة' : 'Passwords do not match', 'error');
            return;
        }
        
        try {
            // إعادة المصادقة
            const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, currentPassword);
            await currentUser.reauthenticateWithCredential(credential);
            
            // تغيير كلمة المرور
            await currentUser.updatePassword(newPassword);
            
            showToast(t('saved'), 'success');
            e.target.reset();
            
        } catch (error) {
            console.error('Error changing password:', error);
            if (error.code === 'auth/wrong-password') {
                showToast(currentLanguage === 'ar' ? 'كلمة المرور الحالية غير صحيحة' : 'Current password is incorrect', 'error');
            } else {
                showToast(t('error'), 'error');
            }
        }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // بدء التطبيق
    // ═══════════════════════════════════════════════════════════════════════
    
    async function initializeApp() {
        // تطبيق اللغة المحفوظة
        document.documentElement.lang = currentLanguage;
        document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
        updateTranslations();
        
        try {
            // التحقق من وجود المدير
            await checkAndCreateAdmin();
            
            // مراقبة حالة المصادقة
            auth.onAuthStateChanged(async (user) => {
                document.getElementById('loading-screen').classList.add('hidden');
                
                if (user) {
                    // المستخدم مسجل دخوله
                    try {
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists) {
                            currentUser = user;
                            currentUserData = userDoc.data();
                            updateUIForUser();
                            document.getElementById('app').classList.remove('hidden');
                            showPage('dashboard');
                        } else {
                            // بيانات المستخدم غير موجودة
                            await auth.signOut();
                            document.getElementById('login-screen').classList.remove('hidden');
                        }
                    } catch (error) {
                        console.error('Error fetching user data:', error);
                        document.getElementById('login-screen').classList.remove('hidden');
                    }
                } else {
                    // المستخدم غير مسجل دخوله
                    document.getElementById('login-screen').classList.remove('hidden');
                }
            });
            
        } catch (error) {
            console.error('Error initializing app:', error);
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }
    }
    
    // معالج نموذج تسجيل الدخول
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');
        const spinner = document.getElementById('login-spinner');
        const btnText = document.getElementById('login-btn-text');
        
        // إخفاء رسالة الخطأ
        errorDiv.classList.add('hidden');
        
        // إظهار التحميل
        spinner.classList.remove('hidden');
        btnText.textContent = t('loading');
        
        try {
            await login(email, password);
        } catch (error) {
            errorDiv.textContent = t('loginError');
            errorDiv.classList.remove('hidden');
        } finally {
            spinner.classList.add('hidden');
            btnText.textContent = t('login');
        }
    });
    
    // إغلاق القوائم المنسدلة عند النقر خارجها
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.dropdown')) {
            document.querySelectorAll('.dropdown-content').forEach(d => {
                d.classList.remove('show');
            });
        }
    });
    
    // بدء التطبيق
    initializeApp();
    </script>
